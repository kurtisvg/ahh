<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahh</title>
  <link rel="stylesheet" href="assets/xterm.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <div class="brand">Ahh</div>
        <button id="new-conversation-button" class="icon-button" type="button" aria-label="New conversation">+</button>
      </div>
      <nav class="sidebar-section" aria-labelledby="conversation-heading">
        <h2 id="conversation-heading" class="section-label">Conversations</h2>
        <div id="conversation-list" class="conversation-list"></div>
        <div id="conversation-empty" class="conversation-empty">No conversations</div>
      </nav>
      <div class="sidebar-footer">Localhost control plane</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="view-heading">
          <div id="view-title" class="view-title">Ahh</div>
          <div id="view-subtitle" class="view-subtitle">No conversation selected</div>
        </div>
        <div class="status-surface" aria-live="polite">
          <div id="status" class="status" data-state="disconnected">
            <span class="dot"></span>
            <span id="status-text">disconnected</span>
          </div>
        </div>
      </header>
      <main class="terminal-region">
        <div id="connection-banner" class="connection-banner" data-state="reconnecting" hidden>
          <span id="connection-banner-text">Connecting to terminal</span>
        </div>
        <section class="terminal-shell" aria-label="Conversation terminal">
          <div class="terminal-tabs" role="tablist" aria-label="Workspace views">
            <button
              class="terminal-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-label="Shell"
            >
              <span class="tab-icon" aria-hidden="true">&gt;_</span>
            </button>
          </div>
          <div class="terminal-stage" role="tabpanel" aria-label="TTY terminal">
            <div id="terminal-state" class="terminal-state" data-state="disconnected">
              <span id="terminal-state-text">No conversation selected</span>
            </div>
            <div id="terminal"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="conversation-dialog" class="modal">
    <form id="create-conversation-form" class="modal-surface" method="dialog">
      <div class="modal-header">
        <h2 class="modal-title">New Conversation</h2>
        <button id="conversation-dialog-close" class="icon-button" type="button" aria-label="Close">&times;</button>
      </div>
      <label class="field-label" for="conversation-name-input">Name</label>
      <input id="conversation-name-input" class="conversation-input" name="name" type="text" autocomplete="off" required>
      <div class="modal-actions">
        <button id="conversation-cancel-button" class="secondary-button" type="button">Cancel</button>
        <button class="primary-button" type="submit">Create</button>
      </div>
    </form>
  </dialog>

  <script src="assets/xterm.js"></script>
  <script src="assets/addon-fit.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
