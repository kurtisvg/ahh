<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahh</title>
  <link rel="stylesheet" href="assets/xterm.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-header">
        <div class="brand">Ahh</div>
      </div>
      <nav class="sidebar-section" aria-labelledby="conversation-heading">
        <h2 id="conversation-heading" class="section-label">Conversations</h2>
        <div class="conversation-list">
          <button class="conversation-item is-active" type="button" data-state="connecting" aria-current="page">
            <span class="conversation-main">
              <span class="conversation-name">Claude Code PTY</span>
              <span class="conversation-meta">Local wrapper</span>
            </span>
            <span class="state-pill" aria-hidden="true"></span>
          </button>
        </div>
      </nav>
      <div class="sidebar-footer">Localhost control plane</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="view-heading">
          <div class="view-title">Ahh</div>
          <div class="view-subtitle">Local wrapper</div>
        </div>
        <div id="status" class="status" data-state="connecting">
          <span class="dot"></span>
          <span id="status-text">connecting</span>
        </div>
      </header>
      <main class="terminal-region">
        <div id="connection-banner" class="connection-banner" data-state="connecting" hidden>
          <span id="connection-banner-text">Connecting to terminal</span>
        </div>
        <section class="terminal-shell" aria-label="Claude Code terminal">
          <div class="terminal-tabs" role="tablist" aria-label="Workspace views">
            <button
              class="terminal-tab is-active"
              type="button"
              role="tab"
              aria-selected="true"
              aria-label="Shell"
            >
              <span class="tab-icon" aria-hidden="true">&gt;_</span>
            </button>
          </div>
          <div class="terminal-stage" role="tabpanel" aria-label="Shell terminal">
            <div id="terminal"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/xterm.js"></script>
  <script src="assets/addon-fit.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
