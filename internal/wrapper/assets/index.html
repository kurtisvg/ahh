<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahh Wrapper Terminal</title>
  <link rel="stylesheet" href="assets/xterm.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --bar: #202020;
      --line: #343434;
      --text: #f2f2f2;
      --muted: #a8a8a8;
      --ok: #66d19e;
      --warn: #f0b45f;
      --bad: #ff7b7b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: 40px minmax(0, 1fr);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--bar);
    }

    .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 92px;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--warn);
    }

    .status[data-state="connected"] .dot {
      background: var(--ok);
    }

    .status[data-state="closed"] .dot,
    .status[data-state="error"] .dot {
      background: var(--bad);
    }

    #terminal {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 10px;
      background: #080808;
    }

    .xterm {
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Claude Code PTY</div>
    <div id="status" class="status" data-state="connecting">
      <span class="dot"></span>
      <span id="status-text">connecting</span>
    </div>
  </header>
  <main id="terminal"></main>

  <script src="assets/xterm.js"></script>
  <script src="assets/addon-fit.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const terminalEl = document.getElementById('terminal');

    const terminal = new Terminal({
      cursorBlink: true,
      convertEol: true,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace',
      fontSize: 14,
      scrollback: 5000,
      theme: {
        background: '#080808',
        foreground: '#f2f2f2',
        cursor: '#f2f2f2',
        selectionBackground: '#4f5f66'
      }
    });
    const fitAddon = new FitAddon.FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(terminalEl);

    function setStatus(state) {
      statusEl.dataset.state = state;
      statusText.textContent = state;
    }

    function terminalSocketURL() {
      const basePath = window.location.pathname.endsWith('/')
        ? window.location.pathname
        : window.location.pathname + '/';
      const url = new URL('pty', window.location.origin + basePath);
      url.protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      return url.toString();
    }

    const socket = new WebSocket(terminalSocketURL());
    socket.binaryType = 'arraybuffer';
    const decoder = new TextDecoder();

    function sendResize() {
      if (socket.readyState !== WebSocket.OPEN) {
        return;
      }
      socket.send(JSON.stringify({
        type: 'resize',
        rows: terminal.rows,
        cols: terminal.cols
      }));
    }

    function fitTerminal() {
      fitAddon.fit();
      sendResize();
    }

    socket.addEventListener('open', () => {
      setStatus('connected');
      fitTerminal();
      terminal.focus();
    });

    socket.addEventListener('message', (event) => {
      if (event.data instanceof ArrayBuffer) {
        terminal.write(decoder.decode(event.data, { stream: true }));
        return;
      }
      terminal.write(event.data);
    });

    socket.addEventListener('close', () => {
      setStatus('closed');
    });

    socket.addEventListener('error', () => {
      setStatus('error');
    });

    terminal.onData((data) => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'input',
          data
        }));
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(fitTerminal, 50);
    });

    fitTerminal();
  </script>
</body>
</html>
