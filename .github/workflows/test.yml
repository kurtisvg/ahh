name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "github.event.action != 'labeled' || github.event.label.name == 'tests: run'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove rerun label
        if: github.event.action == 'labeled'
        # Fork PR tokens may not be allowed to remove labels; still run tests.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'tests: run'
            });
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: internal/server/web/package-lock.json
      - name: Install browser dependencies
        working-directory: internal/server/web
        run: npm ci
      - name: Generate assets
        run: go generate ./...
      - name: Build
        run: go build ./...
      - name: Compile harness integration tests
        run: go test -tags=integration_codex -run '^$' ./...
      - name: Install browser
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps chromium
      - name: Test
        run: go test -count=1 -race -shuffle=on -timeout 5m ./...

  lint:
    if: "github.event.action != 'labeled' || github.event.label.name == 'tests: run'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: internal/server/web/package-lock.json
      - name: Install browser dependencies
        working-directory: internal/server/web
        run: npm ci
      - name: Generate assets
        run: go generate ./...
      - name: Verify go mod tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout 5m
      - name: govulncheck
        run: go tool govulncheck ./...
